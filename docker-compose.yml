# Single compose file for every environment — local dev, a single self-hosted box,
# or AWS EC2 — the services are identical everywhere. What differs between
# environments is only .env: DATABASE_URL/S3_* point at a local Postgres/local disk
# for dev and at RDS/S3 in production, but the containers that run don't change.
# There is deliberately no bundled Postgres/MinIO container and no second compose
# file — this app expects a real, already-running Postgres (a native local install,
# Neon, or RDS) and connects to it purely via DATABASE_URL. See docs/DATABASE.md and
# docs/DEPLOYMENT_AWS.md.
#
#   docker compose up -d migrate   # applies prisma/migrations — creates the schema
#                                   # from scratch on an empty DB, or just the new
#                                   # ones on an existing DB. Safe to re-run.
#   docker compose up -d           # starts app, cron, nginx (migrate already ran
#                                   # above; `app`'s own depends_on re-runs it first
#                                   # anyway if it hasn't, or isn't up to date)

services:
  migrate:
    build:
      context: .
      target: migrate
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets DATABASE_URL="...@host.docker.internal:5432/..." reach a Postgres running on the host machine, on Linux as well as Docker Desktop
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000" # host-only convenience/debugging; nginx reaches it via the "app" service name below
    volumes:
      - app_storage:/app/storage # only used when STORAGE_DRIVER=local; harmless/unused otherwise

  # Reverse proxy in front of `app`. Not optional, even without a domain/TLS yet:
  # it's what makes TRUSTED_IP_HEADER work at all (see deploy/nginx.conf and
  # docs/SELF_HOSTING.md §1) — without it, every clock-in is rejected outright
  # in production. Runs as a container (not host-installed) so its config's
  # `proxy_pass http://app:3000` resolves via Compose's internal DNS.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80" # reachable on the box's public/Elastic IP; add 443 once you have a domain + cert

  cron:
    build:
      context: ./deploy/cron
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL}
      CRON_SECRET: ${CRON_SECRET}
    depends_on:
      - app

volumes:
  app_storage:
